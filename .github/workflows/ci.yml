name: CI

# Lightweight by design: pull requests only, docs-only changes skipped, superseded runs cancelled, fast suite only.
# The slow suite (MB_RUN_SLOW=1) is a local pre-release check; see README "Running tests".
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MB_REQUIRE_ENGINE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install -e . pytest pytest-xdist
          rustup toolchain install stable --profile minimal
      - name: Test and build the engine (one release build)
        run: |
          cargo +stable test --workspace --locked --release
          cargo +stable build --release --locked
      - name: Test the public benchmark (fast suite)
        run: |
          export MB_ENGINE="$PWD/target/release/mb-engine"
          python -m pytest -q -ra -n auto --dist worksteal
