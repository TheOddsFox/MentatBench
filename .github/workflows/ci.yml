name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MB_RUN_SLOW: '1'
      MB_REQUIRE_ENGINE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -e . pytest pytest-xdist
          rustup toolchain install stable --profile minimal
      - name: Test and build the engine
        run: |
          cargo +stable test --workspace --locked
          cargo +stable build --release --locked
      - name: Test the public benchmark
        run: |
          export MB_ENGINE="$PWD/target/release/mb-engine"
          python -m pytest -q -ra -n auto --dist worksteal
